<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Agenda de Eventos - Univassouras</title>
<style>
:root{
  --burgundy:#8d1420;
  --burgundy-dark:#6f1018;
  --yellow:#ffc22d;
  --paper:#ffffff;
  --ink:#4f2528;
  --ui:#f4f5f7;
  --border:#d8dbe0;
  --shadow:0 10px 28px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#e9ebef;
  color:#20242a;
}
button,input,select,textarea{font:inherit}
.appbar{
  position:sticky; top:0; z-index:20;
  background:#fff;
  border-bottom:1px solid #ddd;
  padding:12px 18px;
  display:flex; gap:10px; align-items:center; flex-wrap:wrap;
}
.appbar .brand{font-weight:800;color:var(--burgundy);margin-right:auto}
.btn{
  border:0; border-radius:8px; padding:9px 13px; cursor:pointer;
  background:#e6e8ec; color:#23262b; font-weight:700;
}
.btn.primary{background:var(--burgundy);color:#fff}
.btn.yellow{background:var(--yellow);color:#5e2024}
.btn.danger{background:#fbe7e8;color:#9a1d26}
.shell{
  display:grid;
  grid-template-columns:minmax(380px,540px) 1fr;
  min-height:calc(100vh - 58px);
}
.editor{
  background:#fff;
  padding:18px;
  border-right:1px solid #ddd;
  overflow:auto;
  max-height:calc(100vh - 58px);
}
.preview-pane{padding:20px;overflow:auto}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;font-weight:800;margin-bottom:5px;color:#555}
.field input,.field select,.field textarea{
  width:100%; border:1px solid var(--border); border-radius:7px;
  padding:9px 10px; background:#fff;
}
.field textarea{min-height:66px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.week-box{
  padding:14px;border:1px solid var(--border);border-radius:10px;background:#fafafa;margin-bottom:14px
}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px}
.tab{
  border:1px solid var(--border); background:#fff; padding:8px 9px; border-radius:7px; cursor:pointer;
  font-size:12px;font-weight:800;
}
.tab.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}
.event-form{
  border:1px solid var(--border);border-radius:10px;padding:13px;background:#fbfbfc
}
.event-list{margin-top:14px}
.event-item{
  border:1px solid var(--border);border-radius:9px;padding:10px;margin-bottom:8px;background:#fff
}
.event-item .title{font-weight:800;color:var(--burgundy);margin-bottom:4px}
.event-item .meta{font-size:12px;color:#60656d}
.event-actions{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.event-actions button{padding:5px 8px;font-size:11px;border:1px solid #d2d5da;background:#f4f5f7;border-radius:6px;cursor:pointer}
.help{font-size:12px;color:#666;line-height:1.45;margin-top:10px}
.checkbox{display:flex;align-items:center;gap:8px;font-size:13px}
.checkbox input{width:auto}
.preview-title{font-weight:800;margin-bottom:12px}
.preview-stack{display:flex;flex-direction:column;align-items:center;gap:22px}

/* Visual page: 810 x 1440, matching the Python generator. */
.sheet-wrap{width:445.5px;height:792px;position:relative}
.sheet{
  width:810px;height:1440px;position:absolute;left:0;top:0;
  transform:scale(.55);transform-origin:top left;
  overflow:hidden;background:var(--burgundy);box-shadow:var(--shadow);
}

  display:grid;grid-template-columns:1fr 255px;align-items:center;gap:16px;
}
.day-name{font-size:31px;font-weight:900;color:#fff;line-height:1}
.date-pill{
  height:60px;background:var(--yellow);color:#6c1a20;border-radius:13px;
  display:flex;align-items:center;justify-content:center;
  font-size:29px;font-weight:900;
}
.subtitle{
  color:#fff;font-size:13px;margin:16px 2px 0;letter-spacing:.1px;
  display:flex;justify-content:space-between;gap:10px
}
.cont-tag{color:var(--yellow);font-size:11px;font-weight:900}
.event-card{
  margin-top:16px;background:#fff;border-radius:30px;
  padding:18px 20px 18px 15px;
  display:grid;grid-template-columns:125px 1fr;gap:16px;
  min-height:148px;color:var(--ink);
}
.time-pill{
  background:var(--yellow);border-radius:12px;
  min-height:64px;height:max-content;
  padding:10px 7px;display:flex;align-items:center;justify-content:center;
  text-align:center;font-size:18px;line-height:1.05;font-weight:900;color:#5c2024;
}
.event-title{font-size:18px;line-height:1.08;font-weight:900;color:var(--burgundy);overflow-wrap:anywhere}
.event-course{font-size:14.5px;line-height:1.15;margin-top:18px;color:#2d3035;overflow-wrap:anywhere}
.event-location{font-size:13.5px;line-height:1.15;margin-top:18px;color:var(--burgundy);overflow-wrap:anywhere}
.empty-card{
  margin-top:16px;background:#fff;border-radius:30px;min-height:125px;
  display:flex;align-items:center;justify-content:center;text-align:center;
  color:#5d6168;font-size:17px;padding:25px;
}
.footer{
  position:absolute;left:0;bottom:0;width:810px;height:85px;background:var(--burgundy-dark);
  color:#fff;display:flex;justify-content:space-between;align-items:center;padding:15px 58px 14px 58px;
}
.footer .logo-main{font-size:24px;font-weight:900;letter-spacing:.3px}
.footer .logo-sub{font-size:10.5px;font-weight:800;margin-top:3px}
.footer .tagline{font-size:10.5px;align-self:center}
.measure-box{
  position:absolute;left:-10000px;top:-10000px;visibility:hidden;pointer-events:none;width:730px;
}
.no-events-msg{font-size:13px;color:#777;padding:8px 0}

@media(max-width:1050px){
  .shell{grid-template-columns:1fr}
  .editor{max-height:none;border-right:0;border-bottom:1px solid #ddd}
  .preview-pane{overflow:visible}
}
@media print{
  /*
    Formato personalizado em retrato 9:16.
    135 x 240 mm = proporção exata 9:16.
  */
  @page{
    size:135mm 240mm;
    margin:0;
  }

  html,body{
    width:135mm!important;
    height:auto!important;
    margin:0!important;
    padding:0!important;
    background:#8d1420!important;
  }

  .appbar,.editor,.preview-title{
    display:none!important;
  }

  .shell{
    display:block!important;
    width:135mm!important;
    margin:0!important;
    padding:0!important;
  }

  .preview-pane{
    width:135mm!important;
    margin:0!important;
    padding:0!important;
  }

  .preview-stack{
    display:block!important;
    width:135mm!important;
    margin:0!important;
    padding:0!important;
  }

  .sheet-wrap{
    width:135mm!important;
    height:240mm!important;
    margin:0!important;
    padding:0!important;
    position:relative!important;
    overflow:hidden!important;
    background:#8d1420!important;

    page-break-after:always!important;
    break-after:page!important;

    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }

  .sheet-wrap:last-child{
    page-break-after:auto!important;
    break-after:auto!important;
  }

  .sheet{
    width:810px!important;
    height:1440px!important;

    position:absolute!important;
    left:0!important;
    top:0!important;

    /*
      810 x 1440 já é 9:16.
      A escala abaixo faz a arte ocupar exatamente 135 x 240 mm.
    */
    transform:scale(calc(135mm / 810px))!important;
    transform-origin:top left!important;

    box-shadow:none!important;

    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }
}
</style>
</head>
<body>
<div class="appbar">
  <div class="brand">Agenda de Eventos • Univassouras</div>
  <button class="btn" onclick="saveJSON()">Salvar semana</button>
  <button class="btn" onclick="document.getElementById('loadFile').click()">Carregar semana</button>
  <input id="loadFile" type="file" accept=".json,application/json" hidden onchange="loadJSONFile(event)">
  <button class="btn danger" onclick="clearAll()">Limpar</button>
  <button class="btn yellow" onclick="renderPreview()">Atualizar visualização</button>
  <button class="btn primary" onclick="printPDF()">Gerar PDF</button>
</div>

<div class="shell">
  <aside class="editor">
    <div class="week-box">
      <div class="field">
        <label>Período da semana</label>
        <input id="period" placeholder="Ex.: 05/10 a 10/10" oninput="persist();renderPreviewDebounced()">
      </div>
      <label class="checkbox">
        <input id="includeEmpty" type="checkbox" onchange="persist();renderPreview()">
        Incluir dias sem eventos
      </label>
    </div>

    <div class="tabs" id="dayTabs"></div>

    <div class="field">
      <label>Data do dia selecionado</label>
      <input id="dayDate" placeholder="Ex.: 05/10" oninput="updateDayDate(this.value)">
    </div>

    <div class="event-form">
      <input type="hidden" id="editingIndex" value="-1">
      <div class="row">
        <div class="field">
          <label>Horário</label>
          <input id="evTime" placeholder="Ex.: 10h às 12h">
        </div>
        <div class="field">
          <label>Tipo</label>
          <select id="evKind">
            <option>Atividade</option>
            <option>Oficina</option>
            <option>Palestra</option>
            <option>Visita técnica</option>
            <option>Reunião</option>
            <option>Evento</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Título do evento</label>
        <textarea id="evTitle" placeholder="Digite o título do evento"></textarea>
      </div>
      <div class="field">
        <label>Curso / responsável</label>
        <input id="evCourse" placeholder="Ex.: Medicina Veterinária - Prof. Nome">
      </div>
      <div class="row">
        <div class="field">
          <label>Local / link</label>
          <input id="evLocation" placeholder="Ex.: Campus 3 - Auditório">
        </div>
        <div class="field">
          <label>Modalidade</label>
          <select id="evMode">
            <option>Presencial</option>
            <option>Remoto</option>
          </select>
        </div>
      </div>
      <button class="btn primary" style="width:100%" onclick="addOrUpdateEvent()">Adicionar evento</button>
    </div>

    <div class="event-list" id="eventList"></div>
    <div class="help">
      O encaixe é automático: dias pequenos podem compartilhar a mesma página. Se um dia tiver eventos demais, ele é dividido em páginas de continuação. O botão <b>Gerar PDF</b> abre a impressão do navegador; escolha <b>Salvar como PDF</b>.
    </div>
  </aside>

  <main class="preview-pane">
    <div class="preview-title">Visualização</div>
    <div class="preview-stack" id="previewPages"></div>
  </main>
</div>

<div class="measure-box" id="measureBox"></div>

<script>
const DAY_NAMES = [
  ["SEGUNDA","Segunda-feira"],
  ["TERÇA","Terça-feira"],
  ["QUARTA","Quarta-feira"],
  ["QUINTA","Quinta-feira"],
  ["SEXTA","Sexta-feira"],
  ["SÁBADO","Sábado"],
  ["DOMINGO","Domingo"]
];

const PACK_HEIGHT = 1300; // usable height inside page body, in CSS px at 810x1440.
let activeDay = 0;
let state = defaultState();
let renderTimer = null;

function defaultState(){
  return {
    period:"",
    includeEmpty:false,
    days:DAY_NAMES.map(([key,label])=>({key,label,date:"",events:[]}))
  };
}
function esc(v){
  return String(v ?? "").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
}
function uid(){
  return Math.random().toString(36).slice(2)+Date.now().toString(36);
}
function persist(){
  state.period = document.getElementById("period").value;
  state.includeEmpty = document.getElementById("includeEmpty").checked;
  localStorage.setItem("agenda_univassouras_state", JSON.stringify(state));
}
function restore(){
  try{
    const raw = localStorage.getItem("agenda_univassouras_state");
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && parsed.days && parsed.days.length===7) state=parsed;
    }
  }catch(e){}
}
function init(){
  restore();
  if(location.hash==="#demo") loadDemo();
  document.getElementById("period").value=state.period||"";
  document.getElementById("includeEmpty").checked=!!state.includeEmpty;
  drawTabs();
  selectDay(0);
  renderPreview();
}
function drawTabs(){
  const tabs=document.getElementById("dayTabs");
  tabs.innerHTML="";
  state.days.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(i===activeDay?" active":"");
    b.textContent=d.label.replace("-feira","");
    b.onclick=()=>selectDay(i);
    tabs.appendChild(b);
  });
}
function selectDay(i){
  activeDay=i;
  drawTabs();
  document.getElementById("dayDate").value=state.days[i].date||"";
  clearEventForm();
  drawEventList();
}
function updateDayDate(v){
  state.days[activeDay].date=v;
  persist(); renderPreviewDebounced();
}
function clearEventForm(){
  document.getElementById("editingIndex").value="-1";
  document.getElementById("evTime").value="";
  document.getElementById("evKind").value="Atividade";
  document.getElementById("evTitle").value="";
  document.getElementById("evCourse").value="";
  document.getElementById("evLocation").value="";
  document.getElementById("evMode").value="Presencial";
  const btn=document.querySelector(".event-form .btn.primary");
  btn.textContent="Adicionar evento";
}
function getEventForm(){
  return {
    id:uid(),
    time:document.getElementById("evTime").value.trim(),
    kind:document.getElementById("evKind").value.trim()||"Atividade",
    title:document.getElementById("evTitle").value.trim(),
    course:document.getElementById("evCourse").value.trim(),
    location:document.getElementById("evLocation").value.trim(),
    mode:document.getElementById("evMode").value
  };
}
function addOrUpdateEvent(){
  const e=getEventForm();
  if(!e.title){
    alert("Informe o título do evento.");
    return;
  }
  const idx=Number(document.getElementById("editingIndex").value);
  if(idx>=0){
    e.id=state.days[activeDay].events[idx].id || e.id;
    state.days[activeDay].events[idx]=e;
  }else{
    state.days[activeDay].events.push(e);
  }
  clearEventForm(); drawEventList(); persist(); renderPreview();
}
function editEvent(i){
  const e=state.days[activeDay].events[i];
  document.getElementById("editingIndex").value=i;
  document.getElementById("evTime").value=e.time||"";
  document.getElementById("evKind").value=e.kind||"Atividade";
  document.getElementById("evTitle").value=e.title||"";
  document.getElementById("evCourse").value=e.course||"";
  document.getElementById("evLocation").value=e.location||"";
  document.getElementById("evMode").value=e.mode||"Presencial";
  document.querySelector(".event-form .btn.primary").textContent="Salvar alteração";
  window.scrollTo({top:0,behavior:"smooth"});
}
function deleteEvent(i){
  if(!confirm("Excluir este evento?")) return;
  state.days[activeDay].events.splice(i,1);
  drawEventList(); persist(); renderPreview();
}
function moveEvent(i,delta){
  const arr=state.days[activeDay].events;
  const j=i+delta;
  if(j<0||j>=arr.length) return;
  [arr[i],arr[j]]=[arr[j],arr[i]];
  drawEventList(); persist(); renderPreview();
}
function drawEventList(){
  const box=document.getElementById("eventList");
  const arr=state.days[activeDay].events;
  if(!arr.length){
    box.innerHTML='<div class="no-events-msg">Nenhum evento cadastrado neste dia.</div>';
    return;
  }
  box.innerHTML=arr.map((e,i)=>`
    <div class="event-item">
      <div class="title">${esc(e.time)} • ${esc(e.kind)}: ${esc(e.title)}</div>
      <div class="meta">${esc(e.course)}${e.location?" • "+esc(e.location):""}</div>
      <div class="event-actions">
        <button onclick="editEvent(${i})">Editar</button>
        <button onclick="moveEvent(${i},-1)">↑</button>
        <button onclick="moveEvent(${i},1)">↓</button>
        <button onclick="deleteEvent(${i})">Excluir</button>
      </div>
    </div>
  `).join("");
}

function dayBlockHTML(day, events, continuation=false){
  const cards = events.length ? events.map(e=>`
    <div class="event-card">
      <div class="time-pill">${esc(e.time||"Horário")}</div>
      <div>
        <div class="event-title">${esc(e.kind||"Atividade")}: “${esc(e.title||"Evento")}”</div>
        ${e.course?`<div class="event-course">${esc(e.course)}</div>`:""}
        ${e.location?`<div class="event-location">${e.mode==="Remoto"?"▣":"📍"} ${esc(e.location)}</div>`:""}
      </div>
    </div>
  `).join("") : `<div class="empty-card">Nenhum evento cadastrado para este dia.</div>`;

  return `
    <section class="day-block">
      <div class="day-head">
        <div class="day-name">${esc(day.key)}</div>
        <div class="date-pill">${esc(day.date||"--/--")}</div>
      </div>
      <div class="subtitle">
        <span>EVENTOS DA SEMANA • CAMPUS UNIVERSITÁRIO DE SAQUAREMA</span>
        ${continuation?'<span class="cont-tag">CONTINUAÇÃO</span>':""}
      </div>
      ${cards}
    </section>
  `;
}
function measureBlock(day,events,continuation=false){
  const box=document.getElementById("measureBox");
  box.innerHTML=dayBlockHTML(day,events,continuation);
  const h=box.firstElementChild.getBoundingClientRect().height;
  box.innerHTML="";
  return h;
}
function splitDay(day){
  const evs=day.events||[];
  if(!evs.length) return state.includeEmpty ? [{day,events:[],continuation:false}] : [];
  const blocks=[];
  let chunk=[];
  let continuation=false;
  for(const e of evs){
    chunk.push(e);
    const h=measureBlock(day,chunk,continuation);
    if(h>PACK_HEIGHT && chunk.length>1){
      const last=chunk.pop();
      blocks.push({day,events:[...chunk],continuation});
      continuation=true;
      chunk=[last];
    }
  }
  if(chunk.length) blocks.push({day,events:[...chunk],continuation});
  return blocks;
}
function newContentPage(){
  const wrap=document.createElement("div");
  wrap.className="sheet-wrap";
  wrap.innerHTML=`
    <div class="sheet content-page">
      <div class="page-body"></div>
      <div class="footer">
        <div><div class="logo-main">UNIVASSOURAS</div><div class="logo-sub">CAMPUS UNIVERSITÁRIO DE SAQUAREMA</div></div>
        <div class="tagline">Conhecimento que transforma realidades.</div>
      </div>
    </div>`;
  return wrap;
}
function renderPreview(){
  state.period=document.getElementById("period").value;
  state.includeEmpty=document.getElementById("includeEmpty").checked;
  persist();

  const root=document.getElementById("previewPages");
  root.innerHTML="";

  const coverWrap=document.createElement("div");
  coverWrap.className="sheet-wrap";
  coverWrap.innerHTML=`<div class="sheet cover"><div class="period-pill">${esc(state.period||"PERÍODO DA SEMANA")}</div></div>`;
  root.appendChild(coverWrap);

  let blocks=[];
  state.days.forEach(d=>blocks.push(...splitDay(d)));
  if(!blocks.length) return;

  let page=null, body=null, used=0, count=0;
  function startPage(){
    page=newContentPage();
    root.appendChild(page);
    body=page.querySelector(".page-body");
    used=0; count=0;
  }
  startPage();

  blocks.forEach(b=>{
    const h=measureBlock(b.day,b.events,b.continuation);
    const gap=count?28:0;
    if(count && used+gap+h>PACK_HEIGHT){
      startPage();
    }
    const holder=document.createElement("div");
    holder.innerHTML=dayBlockHTML(b.day,b.events,b.continuation);
    body.appendChild(holder.firstElementChild);
    used += (count?28:0)+h;
    count++;
  });
}
function renderPreviewDebounced(){
  clearTimeout(renderTimer);
  renderTimer=setTimeout(renderPreview,250);
}
function printPDF(){
  renderPreview();
  setTimeout(()=>window.print(),120);
}
function saveJSON(){
  persist();
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="agenda_eventos_semana.json";
  a.click();
  URL.revokeObjectURL(a.href);
}
function loadJSONFile(ev){
  const f=ev.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const obj=JSON.parse(r.result);
      if(!obj.days||obj.days.length!==7) throw new Error();
      state=obj;
      document.getElementById("period").value=state.period||"";
      document.getElementById("includeEmpty").checked=!!state.includeEmpty;
      selectDay(0);persist();renderPreview();
    }catch(e){alert("Arquivo JSON inválido.");}
  };
  r.readAsText(f);
  ev.target.value="";
}
function clearAll(){
  if(!confirm("Apagar todos os eventos e datas desta semana?")) return;
  state=defaultState();
  document.getElementById("period").value="";
  document.getElementById("includeEmpty").checked=false;
  selectDay(0);persist();renderPreview();
}
function loadDemo(){
  state=defaultState();
  state.period="05/10 a 10/10";
  state.days[0].date="05/10";
  state.days[0].events=[
    {id:uid(),time:"10h às 12h",kind:"Atividade",title:"Dos sinais clínicos à imagem: como a ultrassonografia abdominal guia o raciocínio clínico",course:"Medicina Veterinária - Prof. Daniel Carvalho Hainfellner",location:"Campus 3 - sala de aula",mode:"Presencial"}
  ];
  state.days[1].date="06/10";
  state.days[1].events=[
    {id:uid(),time:"08h às 13h",kind:"Atividade",title:"Visita ao Apiário Prazer do Campo",course:"Medicina Veterinária - Prof. Laura Ribeiro C. de Oliveira",location:"Jaconé, Saquarema",mode:"Presencial"},
    {id:uid(),time:"18h às 22h",kind:"Atividade",title:"Semana do Contador 2026 - Carreira, Ética e Tecnologia na Profissão Contábil",course:"Ciências Contábeis - Prof. Polianna R. Fonseca",location:"Campus 1 - Auditório",mode:"Presencial"}
  ];
  state.days[2].date="07/10";
  state.days[2].events=[
    {id:uid(),time:"18h50",kind:"Atividade",title:"Engenharia Civil de Portas Abertas",course:"Engenharia Civil - Prof. Mariá Toledo",location:"Campus 3 - Sala de aula",mode:"Presencial"}
  ];
}
window.addEventListener("beforeprint",renderPreview);
init();
</script>
</body>
</html>
